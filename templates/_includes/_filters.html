<div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasFilters" aria-labelledby="offcanvasFiltersLabel">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title" id="offcanvasFiltersLabel">Filtros</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
  </div>

  <div class="offcanvas-body">
    <div class="filtros-container">

      <div class="mb-3">
        <label class="form-label">Ordenar por</label>
        <select class="form-select filter-input" id="filter-order">
          <option value="">-- Ordenar --</option>
          <option value="nombre">Nombre (A-Z)</option>
          <option value="-nombre">Nombre (Z-A)</option>
          <option value="precio_unitario">Precio (Menor a Mayor)</option>
          <option value="-precio_unitario">Precio (Mayor a Menor)</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input class="form-control filter-input" type="text" id="filter-q" placeholder="Buscar nombre…">
      </div>

      <div class="mb-3">
        <label class="form-label">Código</label>
        <input class="form-control filter-input" type="text" id="filter-codigo" placeholder="Buscar código…">
      </div>

      <div class="mb-3">
        <label class="form-label">Marca</label>
        <select class="form-select filter-input" id="filter-marca">
          <option value="">--Marca--</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Categoría</label>
        <select class="form-select filter-input" id="filter-categoria">
          <option value="">--Categoría--</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Góndola</label>
        <select class="form-select filter-input" id="filter-gondola">
          <option value="">--Góndola--</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Stock</label>
        <select class="form-select filter-input" id="filter-stock">
          <option value="">--Stock--</option>
          <option value="available">Con stock</option>
          <option value="out">Sin stock</option>
        </select>
      </div>

      <div class="d-flex justify-content-between mt-3 gap-2">
        <button id="btn-clean-filters" class="btn btn-secondary w-100">Limpiar filtros</button>
      </div>

    </div>
  </div>
</div>
