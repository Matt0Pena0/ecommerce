{% load productos_filters %}
{% load static %}

<!-- Botón para abrir filtros -->
<button class="btn btn-primary btn-sm mb-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasFilters" aria-controls="offcanvasFilters">
  ☰ Filtros
</button>

<!-- Offcanvas -->
<div class="offcanvas offcanvas-start" style="max-height:auto" tabindex="-1" id="offcanvasFilters" aria-labelledby="offcanvasFiltersLabel">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title" id="offcanvasFiltersLabel">Filtros</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
  </div>
  <div class="offcanvas-body">

    <form method="get" class="filtros-form">

      <!-- Orden -->
      <div class="mb-3">
        <label class="form-label">{{ order_fields|get_label:current_order }}</label>
        <select class="form-select" name="order">
          {% for opt in order_fields %}
          <option value="{{ opt.key }}" {% if opt.key == current_order %}selected{% endif %}>{{ opt.label }}</option>
          {% endfor %}
        </select>
      </div>

      <!-- Buscar nombre -->
      <div class="mb-3">
        <input class="form-control" type="text" name="q" placeholder="Buscar nombre…" value="{{ request.GET.q }}">
      </div>

      <!-- Buscar código -->
      <div class="mb-3">
        <input class="form-control" type="text" name="codigo" placeholder="Buscar código…" value="{{ request.GET.codigo }}">
      </div>

      <!-- Marca -->
      <div class="mb-3">
        <label class="form-label">Marca</label>
        <select class="form-select" name="marca">
          <option value="">--Marca--</option>
          {% for m in marcas %}
          <option value="{{ m.id }}" {% if m.id|stringformat:"s" == request.GET.marca %}selected{% endif %}>{{ m.nombre }}</option>
          {% endfor %}
        </select>
      </div>

      <!-- Categoría -->
      <div class="mb-3">
        <label class="form-label">Categoría</label>
        <select class="form-select" name="categoria">
          <option value="">--Categoría--</option>
          {% for c in categorias %}
          <option value="{{ c.id }}" {% if c.id|stringformat:"s" == request.GET.categoria %}selected{% endif %}>{{ c.nombre }}</option>
          {% endfor %}
        </select>
      </div>

      <!-- Góndola -->
      <div class="mb-3">
        <label class="form-label">Góndola</label>
        <select class="form-select" name="gondola">
          <option value="">--Góndola--</option>
          {% for g in gondolas %}
          <option value="{{ g.id }}" {% if g.id|stringformat:"s" == request.GET.gondola %}selected{% endif %}>{{ g.nombre }}</option>
          {% endfor %}
        </select>
      </div>

      <!-- Stock -->
      <div class="mb-3">
        <label class="form-label">Stock</label>
        <select class="form-select" name="stock">
          <option value="" {% if not request.GET.stock %}selected{% endif %}>--Stock--</option>
          <option value="available" {% if request.GET.stock == "available" %}selected{% endif %}>Con stock</option>
          <option value="out" {% if request.GET.stock == "out" %}selected{% endif %}>Sin stock</option>
        </select>
      </div>

      <!-- Botones -->
      <div class="d-flex justify-content-between mt-3">
        <button type="submit" class="btn btn-primary">Aplicar</button>
        <a href="{% url 'productos:listar' %}" class="btn btn-secondary">Limpiar filtros</a>
      </div>

    </form>

  </div>
</div>

{% block head %}
<script src="{% static 'js/filters.js' %}"></script>
{% endblock head %}
