<ul>
    <li><a href="{% url 'core:home' %}">Inicio</a></li>

    # Añadir aqui las url necesarias

    {% comment %} <li><a href="{% url 'core:contact' %}">Contacto</a></li> {% endcomment %}
    {% comment %} <li><a href="{% url 'core:register' %}">Registro</a></li> {% endcomment %}
</ul>

<section class="user">
  {% if request.user.is_authenticated %}
    <p>Estás logueado como: {{request.user}}</p>
    <li><a href="{% url 'accounts:logout' %}">Cerrar Sesión</a></li>
  {% else %}
    <li><a href="{% url 'accounts:login' %}">Iniciar Sesión</a></li>
  {% endif %}
</section>
