{% extends 'layout_base.html' %}

{% block head_title %}Recuperar Contraseña{% endblock %}

{% block page_content %}
  <h2>¿Olvidaste tu contraseña?</h2>
  <p>Ingresá tu email y te enviaremos instrucciones.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Enviar</button>
  </form>
{% endblock %}
