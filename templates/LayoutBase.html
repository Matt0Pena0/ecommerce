<!DOCTYPE html>
<html lang="es">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      {% load static %}
      <link rel="stylesheet" href="{% static 'css/base.css' %}">
      {% block head %}{% endblock %}
  </head>
  <body>
    <header>
      {% include '_includes/_navbar.html' %}
    </header>
    {% if messages %}
      <div class="messages">
        {% for message in messages %}
          {% if message.tags %}
            <div class="{{ message.tags }}">
            {{ message }}
          {% endif %}
        {% endfor %}
      </div>
    {% endif %} 
    <div class="page-content">
      {% block page_content %}

      {% endblock %}
    </div>

      {% include '_includes/_footer.html' %}
  </body>
</html>
