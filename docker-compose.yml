# ==============================================================================
# Docker Compose — Producción (Ecommerce)
# ==============================================================================
# Arquitectura VPS multi-proyecto con gateway central (Nginx Proxy Manager).
#
# Ubicación en servidor: /opt/ecommerce/docker-compose.yml
#
# PRINCIPIOS (ver .infra/SECURITY.md):
#   - Ningún servicio interno (db, web) publica puertos al host.
#   - Solo el contenedor nginx (ecommerce-nginx) se conecta a proxy-network,
#     visible para el gateway central que gestiona SSL y ruteo por subdominio.
#   - La red 'internal' aísla la comunicación entre servicios del proyecto.
#
# SETUP:
#   1. La red proxy-network debe existir: docker network create proxy-network
#   2. Crear .env.prod (ver .env.example, bloque B)
#   3. docker login ghcr.io && docker compose pull && docker compose up -d
#   4. En NPM: Proxy Host -> Forward Host: ecommerce-nginx, Port: 80, SSL automático
#
# IMAGEN: el servicio `web` NO se construye aquí. La imagen la publica GitHub
# Actions en GHCR (ver FEAT-008). El VPS solo hace pull.
# ==============================================================================

services:

  # --------------------------------------------------------------------------
  # Base de Datos — MySQL 8.0
  # --------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: ecommerce-db
    restart: unless-stopped
    # IMPORTANTE: las variables MYSQL_* se definen en .env.prod y se inyectan vía
    # env_file. NO usar un bloque `environment:` con ${...} aquí: la interpolación
    # de Compose lee ./.env (o --env-file), NO env_file, y `environment` tiene
    # precedencia sobre `env_file` — resultaría en credenciales vacías.
    env_file: .env.prod
    volumes:
      - ./data/mysql:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      # CMD-SHELL + $$ para que la variable la expanda el shell DEL CONTENEDOR
      # (no Compose), tomándola de env_file.
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # --------------------------------------------------------------------------
  # Backend — Django + Gunicorn
  # --------------------------------------------------------------------------
  web:
    # Imagen preconstruida y publicada por GitHub Actions en GHCR.
    # WEB_TAG permite fijar un SHA concreto para rollback:
    #   WEB_TAG=sha-a1b2c3d docker compose up -d web
    # El default ':-latest' evita que la variable quede vacía si no está definida.
    image: ghcr.io/matt0pena0/ecommerce/web:${WEB_TAG:-latest}
    pull_policy: always
    container_name: ecommerce-web
    restart: unless-stopped
    env_file: .env.prod
    expose:
      - "8000"
    volumes:
      - static_volume:/app/staticfiles
      # media como bind mount (no volumen nombrado): las imágenes semilla
      # versionadas (mediafiles/productos/producto.png) quedan disponibles de
      # inmediato tras el git clone, y los uploads son fáciles de respaldar.
      - ./mediafiles:/app/mediafiles
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # Nginx — Reverse Proxy Interno
  # --------------------------------------------------------------------------
  # ÚNICO punto de contacto con el gateway central (NPM). Sirve estáticos/media
  # y proxya el resto a Gunicorn. Conectado a internal + proxy-network.
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: ecommerce-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
      - ./mediafiles:/app/mediafiles:ro
    expose:
      - "80"
    networks:
      - internal
      - proxy-network
    depends_on:
      - web

# ==============================================================================
# Redes
# ==============================================================================
networks:
  internal:
    driver: bridge
  proxy-network:
    external: true   # Red creada por el gateway central (NPM)

# ==============================================================================
# Volúmenes
# ==============================================================================
volumes:
  # static_volume: regenerado por `collectstatic` en cada arranque del entrypoint.
  # media: NO es volumen nombrado, es bind mount ./mediafiles (ver servicio web).
  static_volume:
