name: Deploy

# ==============================================================================
# Despliegue continuo al VPS vía GHCR (Ecommerce) — FEAT-008
# ==============================================================================
# El build ocurre en el runner de Actions y se publica como imagen en GHCR.
# El VPS NO construye: solo hace `docker compose pull` + `up -d`.
#
# El workflow es AUTOSUFICIENTE e IDEMPOTENTE: crea la red docker, clona el
# repositorio la primera vez y sincroniza en los siguientes deploys.
#
# ÚNICO paso manual previo (una sola vez): que exista /opt/ecommerce/.env.prod
# con los secretos. Puede automatizarse definiendo el secret ENV_PROD.
#
# RED: el VPS no expone SSH a internet. El runner se une al tailnet de Tailscale
# como nodo efímero y accede por la IP interna (100.x.y.z o nombre MagicDNS).
#
# Secrets:
#   TS_OAUTH_CLIENT_ID  OAuth client de Tailscale (scope auth_keys, escritura)
#   TS_OAUTH_SECRET     Secret del OAuth client de Tailscale
#   VPS_HOST            IP de Tailscale del VPS (100.x.y.z) o nombre MagicDNS
#   VPS_USER            usuario SSH con permisos sobre Docker
#   VPS_SSH_KEY         clave privada SSH
#   VPS_DEPLOY_PATH     ruta de despliegue en el VPS (ej: /opt/ecommerce)
#   VPS_SSH_PORT        (opcional) puerto SSH, por defecto 22
#   ENV_PROD            (opcional) contenido completo de .env.prod
#   GHCR_TOKEN          (opcional, recomendado) PAT con read:packages para que el
#                       VPS pueda hacer pull de forma autónoma. Si no se define,
#                       se usa GITHUB_TOKEN (válido solo durante el job).
# ==============================================================================

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      load_fixtures:
        description: "Cargar data/backup.json (SOLO primer deploy: sobrescribe datos)"
        type: boolean
        default: false
      skip_build:
        description: "Desplegar la imagen :latest existente sin reconstruir"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # ==========================================================================
  # 1. Build y publicación de la imagen en GHCR
  # ==========================================================================
  build-and-push:
    name: Build y push a GHCR
    runs-on: ubuntu-latest
    if: github.repository == 'Matt0Pena0/ecommerce' && inputs.skip_build != true
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR exige la ruta de imagen en minúsculas.
      - name: Normalizar nombre de imagen
        id: meta
        run: |
          echo "image=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/web" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen
        run: |
          echo "Imagen publicada:" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.meta.outputs.image }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}\`" >> "$GITHUB_STEP_SUMMARY"

  # ==========================================================================
  # 2. Despliegue en el VPS (pull, sin build)
  # ==========================================================================
  deploy:
    name: Deploy al VPS
    runs-on: ubuntu-latest
    needs: [build-and-push]
    # `always()` + comprobación explícita permite desplegar con skip_build=true,
    # caso en el que build-and-push queda 'skipped' (no 'failure').
    if: |
      always() &&
      github.repository == 'Matt0Pena0/ecommerce' &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')

    steps:
      # ----------------------------------------------------------------------
      # Acceso a la red privada (Tailscale)
      # ----------------------------------------------------------------------
      # El VPS NO expone SSH a internet: el acceso es por la VPN de Tailscale.
      # Este paso une al runner al tailnet como nodo EFÍMERO (se desconecta al
      # terminar el job), permitiendo el SSH posterior contra la IP interna.
      #
      # Requisitos en el panel de Tailscale:
      #   - OAuth client con scope `auth_keys` (escritura)
      #   - Tag `tag:ci` definido en las ACL y autorizado a alcanzar el VPS:22
      # ----------------------------------------------------------------------
      - name: Conectar a Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # Diagnóstico: si el SSH falla, este paso permite distinguir un problema de
      # VPN/ACL de un problema de credenciales SSH. No bloquea el despliegue.
      - name: Verificar conectividad con el VPS
        continue-on-error: true
        run: |
          echo "==> Estado de Tailscale"
          tailscale status
          echo "==> Comprobando puerto 22 en ${{ secrets.VPS_HOST }}"
          timeout 15 bash -c 'until nc -z "$1" "${2:-22}"; do sleep 1; done' _ \
            "${{ secrets.VPS_HOST }}" "${{ secrets.VPS_SSH_PORT || 22 }}" \
            && echo "Puerto SSH alcanzable por la VPN" \
            || echo "AVISO: no se alcanzó el puerto SSH (revisar ACL de tag:ci)"

      - name: Desplegar por SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          REPO_URL: https://github.com/${{ github.repository }}.git
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          ENV_PROD: ${{ secrets.ENV_PROD }}
          LOAD_FIXTURES: ${{ inputs.load_fixtures }}
          REGISTRY: ${{ env.REGISTRY }}
          GHCR_USER: ${{ github.actor }}
          GHCR_PASS: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          envs: REPO_URL,DEPLOY_PATH,ENV_PROD,LOAD_FIXTURES,REGISTRY,GHCR_USER,GHCR_PASS
          script: |
            set -e

            # ---------------------------------------------------------------
            # 0. Validación de entradas obligatorias
            # ---------------------------------------------------------------
            # Sin esto, un secret ausente produce errores crípticos aguas abajo
            # (p. ej. `mkdir: cannot create directory ''`).
            if [ -z "$DEPLOY_PATH" ]; then
              echo "ERROR: el secret VPS_DEPLOY_PATH está vacío o no existe." >&2
              echo "       Definilo en Settings > Secrets and variables > Actions" >&2
              echo "       con el valor: /opt/ecommerce" >&2
              exit 1
            fi
            if [ -z "$REPO_URL" ]; then
              echo "ERROR: REPO_URL vacío (no se pudo derivar el repositorio)." >&2
              exit 1
            fi
            echo "==> Ruta de despliegue: $DEPLOY_PATH"

            # ---------------------------------------------------------------
            # 1. Red compartida del gateway
            # ---------------------------------------------------------------
            if ! docker network inspect proxy-network >/dev/null 2>&1; then
              echo "==> Creando red proxy-network"
              docker network create proxy-network
            fi

            # ---------------------------------------------------------------
            # 2. Código fuente (compose, nginx.conf, fixtures, media semilla)
            #    Sigue siendo necesario aunque el build ya no ocurra aquí.
            # ---------------------------------------------------------------
            # Se inicializa el repo EN EL LUGAR (init + fetch) en lugar de usar
            # `git clone`, porque el directorio de despliegue puede existir ya y
            # contener archivos que NO están en git y deben preservarse:
            #   .env.prod, data/mysql/, mediafiles/ (uploads)
            # `git clone` falla si el destino no está vacío.
            # El directorio puede existir y pertenecer a root (creado con
            # `sudo mkdir`), en cuyo caso `git init` falla con "Permission denied".
            # Se intenta corregir la propiedad y, si no se puede, se aborta con
            # una instrucción concreta en lugar de un error opaco.
            if [ ! -d "$DEPLOY_PATH" ]; then
              mkdir -p "$DEPLOY_PATH" 2>/dev/null || sudo mkdir -p "$DEPLOY_PATH" || true
            fi

            if [ ! -w "$DEPLOY_PATH" ]; then
              echo "==> $DEPLOY_PATH no es escribible por $(whoami); ajustando propiedad"
              sudo chown -R "$(id -u):$(id -g)" "$DEPLOY_PATH" 2>/dev/null || true
            fi

            if [ ! -w "$DEPLOY_PATH" ]; then
              echo "ERROR: $DEPLOY_PATH no es escribible por el usuario $(whoami)." >&2
              echo "       Ejecutá en el VPS:" >&2
              echo "         sudo chown -R $(whoami):$(whoami) $DEPLOY_PATH" >&2
              exit 1
            fi

            cd "$DEPLOY_PATH"

            if [ ! -d .git ]; then
              echo "==> Primer despliegue: inicializando repositorio en $DEPLOY_PATH"
              git init -q
              git remote add origin "$REPO_URL"
            else
              echo "==> Sincronizando con origin/main"
              git remote set-url origin "$REPO_URL"
            fi

            git fetch --prune origin
            # symbolic-ref + reset --hard en vez de checkout: reset no aborta si
            # hay archivos sin trackear que colisionan con los del repo.
            git symbolic-ref HEAD refs/heads/main
            git reset --hard origin/main
            echo "==> Commit desplegado: $(git rev-parse --short HEAD)"

            # ---------------------------------------------------------------
            # 3. Archivo de entorno
            # ---------------------------------------------------------------
            if [ -n "$ENV_PROD" ]; then
              echo "==> Escribiendo .env.prod desde el secret ENV_PROD"
              printf '%s\n' "$ENV_PROD" > .env.prod
              chmod 600 .env.prod
            fi

            if [ ! -f .env.prod ]; then
              echo "ERROR: no existe $DEPLOY_PATH/.env.prod" >&2
              echo "Créalo en el servidor (ver .env.example, bloque B) o define el secret ENV_PROD." >&2
              exit 1
            fi

            # ---------------------------------------------------------------
            # 4. Permisos del bind mount de media (contenedor corre como uid 1000)
            # ---------------------------------------------------------------
            mkdir -p mediafiles data/mysql
            if [ "$(stat -c '%u' mediafiles)" != "1000" ]; then
              echo "==> Ajustando propiedad de mediafiles a uid 1000"
              sudo chown -R 1000:1000 mediafiles || chown -R 1000:1000 mediafiles || true
            fi

            # ---------------------------------------------------------------
            # 5. Autenticación contra GHCR y pull de la imagen
            # ---------------------------------------------------------------
            echo "==> Autenticando en $REGISTRY"
            printf '%s' "$GHCR_PASS" | docker login "$REGISTRY" -u "$GHCR_USER" --password-stdin

            echo "==> Descargando imagen"
            docker compose pull web

            # ---------------------------------------------------------------
            # 6. Levantar servicios (SIN build: la imagen viene de GHCR)
            # ---------------------------------------------------------------
            echo "==> Levantando servicios"
            docker compose up -d

            # migrate y collectstatic los ejecuta docker/entrypoint.sh al arrancar.
            echo "==> Esperando a que el servicio web esté en ejecución"
            for i in $(seq 1 45); do
              cid="$(docker compose ps -q web)"
              if [ -n "$cid" ] && [ "$(docker inspect -f '{{.State.Running}}' "$cid")" = "true" ]; then
                echo "web en ejecución"; break
              fi
              if [ "$i" -eq 45 ]; then
                echo "ERROR: web no arrancó. Logs:" >&2
                docker compose logs --tail=80 web >&2
                exit 1
              fi
              sleep 2
            done

            # ---------------------------------------------------------------
            # 6b. Sanidad: el gateway debe compartir red con nuestro nginx
            # ---------------------------------------------------------------
            # Si el gateway y ecommerce-nginx no están en la misma red, el sitio
            # devuelve 502 aunque todos los contenedores estén "Up". Este chequeo
            # convierte ese fallo silencioso en un aviso visible.
            gw="$(docker ps --filter 'ancestor=jc21/nginx-proxy-manager:latest' --format '{{.Names}}' | head -1)"
            if [ -n "$gw" ]; then
              if docker inspect "$gw" --format '{{range $n, $c := .NetworkSettings.Networks}}{{$n}} {{end}}' \
                   | grep -qw proxy-network; then
                echo "OK: $gw comparte proxy-network con ecommerce-nginx"
              else
                echo "AVISO: $gw NO está en proxy-network. El sitio dará 502." >&2
                echo "       Solución: docker network connect proxy-network $gw" >&2
              fi
            fi

            # ---------------------------------------------------------------
            # 7. Carga inicial de datos (opt-in, solo primer deploy)
            # ---------------------------------------------------------------
            if [ "$LOAD_FIXTURES" = "true" ]; then
              echo "==> Cargando data/backup.json"
              docker compose exec -T web python manage.py loaddata data/backup.json
            fi

            # ---------------------------------------------------------------
            # 8. Limpieza y estado
            # ---------------------------------------------------------------
            docker logout "$REGISTRY" || true
            docker image prune -f
            docker compose ps
