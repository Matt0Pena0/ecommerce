name: CI

# En push a main, la publicación de la imagen la realiza deploy.yml (FEAT-008).
# Aquí el build es solo de validación: verifica que la imagen compile, sin publicar.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    name: Django checks & tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_ci_password
          MYSQL_DATABASE: ecommerce_ci_db
          MYSQL_USER: ci_user
          MYSQL_PASSWORD: ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot_ci_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SECRET_KEY: ci-insecure-secret-key-for-testing-only
      DEBUG: "False"
      DB_ENGINE: django.db.backends.mysql
      DB_NAME: ecommerce_ci_db
      DB_USER: ci_user
      DB_PASS: ci_password
      DB_ROOT_PASSWORD: root_ci_password
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # El proyecto NO tiene requirements.txt ni pyproject.toml en la raíz:
          # las dependencias viven en requirements/{base,dev,prod}.txt.
          # Sin esta ruta explícita, la caché de pip falla al no encontrar
          # los globs por defecto (**/requirements.txt, **/pyproject.toml).
          cache-dependency-path: requirements/*.txt

      - name: Install system dependencies (mysqlclient)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential default-libmysqlclient-dev pkg-config default-mysql-client

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -u root -proot_ci_password --silent; then
              echo "MySQL is up"; break
            fi
            echo "Waiting for MySQL..."; sleep 2
          done

      # Django crea una base aparte para los tests: test_<DB_NAME>. El contenedor
      # de MySQL solo concede privilegios sobre DB_NAME, así que sin este GRANT
      # los tests fallan con: (1044, "Access denied ... to database 'test_...'").
      # El patrón `test_%` cubre también las bases paralelas (test_..._gw0, etc.).
      - name: Conceder privilegios sobre la base de tests
        run: |
          mysql -h 127.0.0.1 -u root -p"$DB_ROOT_PASSWORD" \
            -e "GRANT ALL PRIVILEGES ON \`test_%\`.* TO '$DB_USER'@'%'; FLUSH PRIVILEGES;"

      - name: Django system check
        run: python manage.py check

      - name: Verify migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      - name: Run migrations
        run: python manage.py migrate --noinput

      # El proyecto usa pytest + pytest-django (ver pytest.ini y requirements/dev.txt).
      # pytest.ini fija DJANGO_SETTINGS_MODULE=config.settings.dev.
      - name: Run tests (pytest)
        run: pytest -v

  build:
    name: Docker build (validación, sin push)
    runs-on: ubuntu-latest
    needs: checks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Valida que la imagen de producción compile. La publicación en GHCR es
      # responsabilidad de deploy.yml (job build-and-push), que corre solo en
      # push a main. Se comparte la caché de GHA para no duplicar trabajo.
      - name: Build production image (sin push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ecommerce-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
