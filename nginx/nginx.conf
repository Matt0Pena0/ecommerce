# ==============================================================================
# Nginx — Reverse Proxy Interno del Proyecto Ecommerce
# ==============================================================================
# Ubicación en servidor: /opt/ecommerce/nginx/nginx.conf
#
# Este nginx es el ÚNICO punto de contacto entre el proyecto y el gateway central
# (Nginx Proxy Manager). NPM rutea tráfico hacia este contenedor usando el
# container_name: ecommerce-nginx dentro de la red proxy-network.
#
# PRINCIPIOS:
#   - NO gestiona SSL (lo hace el gateway central)
#   - NO usa server_name específico (el gateway resuelve por subdominio)
#   - Escucha exclusivamente en puerto 80
#   - Sirve estáticos y media desde volúmenes compartidos con el servicio web
#   - Rutea el resto a Gunicorn (web:8000)
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- Performance ---
    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml text/javascript image/svg+xml;

    # --- Security Headers ---
    # El gateway central puede agregar headers adicionales (HSTS, CSP).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Rate Limiting ---
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # --- Upstream Django (Gunicorn) ---
    upstream django {
        server web:8000;
    }

    # --- Protocolo original (CRÍTICO) ---
    # Este nginx escucha en :80, por lo que $scheme siempre vale "http".
    # El gateway central (NPM) termina el SSL y envía X-Forwarded-Proto: https.
    # Si sobrescribiéramos el header con $scheme, Django (SECURE_SSL_REDIRECT=True
    # + SECURE_PROXY_SSL_HEADER) creería que la petición es insegura y redirigiría
    # en bucle infinito (ERR_TOO_MANY_REDIRECTS).
    # Por eso se propaga el header entrante, con $scheme solo como fallback.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # --- Server Block ---
    server {
        listen 80;
        server_name _;

        # Tamaño máximo de body (uploads de imágenes de productos)
        client_max_body_size 10M;

        # ==================================================================
        # Archivos estáticos — servidos directamente por nginx
        # ==================================================================
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public";
            access_log off;
        }

        # ==================================================================
        # Archivos de media (uploads: imágenes de productos)
        # ==================================================================
        location /media/ {
            alias /app/mediafiles/;
            expires 7d;
            add_header Cache-Control "public";
            access_log off;
        }

        # ==================================================================
        # API REST del backend (DRF)
        # ==================================================================
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://django;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ==================================================================
        # Aplicación Django (páginas SSR, admin, etc.)
        # ==================================================================
        location / {
            proxy_pass http://django;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
