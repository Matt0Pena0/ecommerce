# ==============================================================================
# Docker Compose — Plantilla de Proyecto Completo
# ==============================================================================
# Proyecto: Ecommerce
# Servicios: DB + Cache + Backend + Frontend + Nginx (reverse proxy interno)
#
# USO:
#   1. Copiar este archivo a la raíz del proyecto como docker-compose.yml
#   2. Sustituir todos los {{PLACEHOLDER}} con valores reales
#   3. Crear .env.prod con las variables de entorno (ver env.template)
#   4. Ejecutar: docker compose up -d
#
# PRINCIPIOS:
#   - Ningún servicio interno publica puertos al host
#   - Solo el nginx interno se conecta a proxy-network (visible al gateway)
#   - La red 'internal' aísla la comunicación entre servicios del proyecto
# ==============================================================================

services:

  # --------------------------------------------------------------------------
  # Base de Datos
  # --------------------------------------------------------------------------
  db:
    image: mysql:8.0
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - ./data/mysql:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --------------------------------------------------------------------------
  # Cache / Message Broker
  # --------------------------------------------------------------------------
  cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass $${REDIS_PASSWORD}
    volumes:
      - ./data/redis:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # Backend (API / Application Server)
  # --------------------------------------------------------------------------
  backend:
    # ESTÁNDAR: imagen preconstruida y publicada por CI en GHCR. El VPS no compila.
    # Etiquetar también con sha-<short> permite rollback sin rebuild:
    #   BACKEND_TAG=sha-a1b2c3d docker compose up -d backend
    image: ghcr.io/{{GH_OWNER}}/{{GH_REPO}}/backend:${BACKEND_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    env_file: .env.prod
    expose:
      - "8000"
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # Frontend (SPA / SSR / Static)
  # --------------------------------------------------------------------------
  frontend:
    image: ghcr.io/{{GH_OWNER}}/{{GH_REPO}}/frontend:${FRONTEND_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - internal
    depends_on:
      - backend

  # --------------------------------------------------------------------------
  # Nginx — Reverse Proxy Interno
  # --------------------------------------------------------------------------
  # Este contenedor es el ÚNICO punto de contacto con el gateway central.
  # NPM/Traefik/Caddy rutea tráfico hacia este contenedor por nombre.
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: ecommerce-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    expose:
      - "80"
    networks:
      - internal
      - proxy-network
    depends_on:
      - backend
      - frontend

# ==============================================================================
# Redes
# ==============================================================================
networks:
  internal:
    driver: bridge
  proxy-network:
    external: true    # Red creada por el gateway central (ver proxy/docker-compose.template.yml)
