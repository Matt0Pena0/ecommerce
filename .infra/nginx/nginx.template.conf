# ==============================================================================
# Nginx — Reverse Proxy Interno del Proyecto
# ==============================================================================
# Ubicación en servidor: /opt/ecommerce/nginx/nginx.conf
#
# Este nginx es el ÚNICO punto de contacto entre el proyecto y el gateway central
# (Nginx Proxy Manager). NPM/Traefik/Caddy rutea tráfico hacia este contenedor
# usando el container_name: ecommerce-nginx dentro de proxy-network.
#
# PRINCIPIOS:
#   - NO gestiona SSL (lo hace el gateway central)
#   - NO usa server_name específico (el gateway resuelve por subdominio)
#   - Escucha exclusivamente en puerto 80
#   - Rutea a servicios internos por nombre de contenedor Docker
#
# ADAPTACIONES:
#   - Si el proyecto no tiene WebSockets, eliminar el bloque location /ws/
#   - Si el proyecto no tiene backend, eliminar los bloques /api/ y /ws/
#   - Ajustar rate limiting según las necesidades del proyecto
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- Performance ---
    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml text/javascript image/svg+xml;

    # --- Security Headers ---
    # Aplicados a todas las respuestas que pasan por este proxy.
    # El gateway central puede agregar headers adicionales (HSTS, CSP).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Rate Limiting ---
    # Zona compartida para endpoints de API. Ajustar rate según tráfico esperado.
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # --- Upstreams ---
    upstream backend  { server backend:8000; }
    upstream frontend { server frontend:80; }

    # --- Server Block ---
    server {
        listen 80;
        server_name _;

        # Tamaño máximo de body (uploads, requests grandes)
        client_max_body_size 10M;

        # ==================================================================
        # API — Endpoints REST del backend
        # ==================================================================
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts para operaciones largas (ajustar según necesidad)
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ==================================================================
        # WebSockets — Conexiones persistentes bidireccionales
        # ==================================================================
        # ELIMINAR este bloque si el proyecto no usa WebSockets.
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Timeout largo para mantener la conexión WS abierta
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ==================================================================
        # Health Check — Endpoint para el gateway / monitoreo externo
        # ==================================================================
        location = /health {
            proxy_pass http://backend;
            proxy_set_header Host $http_host;
            access_log off;
        }

        # ==================================================================
        # Frontend — SPA con fallback a index.html
        # ==================================================================
        # En producción, el contenedor frontend sirve estáticos via nginx interno.
        # Este bloque actúa como proxy hacia ese contenedor.
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ==================================================================
        # Archivos estáticos — Cache headers (opcional)
        # ==================================================================
        # Si el frontend usa hash en filenames (Vite, Webpack), cachear agresivamente.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }
}
